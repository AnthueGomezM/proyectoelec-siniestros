<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ingreso del personal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231B2A2E'/%3E%3Crect x='5' y='6' width='4' height='20' fill='%23B3261E'/%3E%3Crect x='12' y='9' width='15' height='2.5' fill='%23F2F4F3'/%3E%3Crect x='12' y='15' width='15' height='2.5' fill='%23F2F4F3'/%3E%3Crect x='12' y='21' width='9' height='2.5' fill='%23F2F4F3'/%3E%3C/svg%3E">
</head>
<body class="vista-cliente">

<header class="guardia">
  <div class="guardia-identidad">
    <svg class="marca" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" fill="#1B2A2E"/><rect x="5" y="6" width="4" height="20" fill="#B3261E"/>
      <rect x="12" y="9" width="15" height="2.5" fill="#F2F4F3"/><rect x="12" y="15" width="15" height="2.5" fill="#F2F4F3"/>
      <rect x="12" y="21" width="9" height="2.5" fill="#F2F4F3"/>
    </svg>
    <div>
      <h1>Guardia de triaje</h1>
      <p>Acceso del personal</p>
    </div>
  </div>
  <nav class="nav" aria-label="Vistas">
    <a href="/">Reportar un siniestro</a>
  </nav>
</header>

<main class="una-columna">
  <section class="tarjeta tarjeta-ingreso" aria-labelledby="h-ingreso">
    <h2 id="h-ingreso">Ingresar</h2>
    <p class="nota" id="motivo">Esta sección es solo para el personal autorizado.</p>
    <form id="formulario" novalidate>
      <label class="ancho">Usuario
        <input name="usuario" autocomplete="username" required spellcheck="false" autocapitalize="none">
      </label>
      <label class="ancho">Clave
        <input name="clave" type="password" autocomplete="current-password" required>
      </label>
      <p class="error-formulario" id="errorFormulario" role="alert" hidden></p>
      <button type="submit" class="boton-principal" id="enviar">Ingresar</button>
    </form>
  </section>
</main>

<div class="brindis" id="brindis" role="status" hidden></div>
<script src="/static/comun.js"></script>
<script src="/static/ingresar.js"></script>
</body>
</html>
